name: Firebase sync acceptance
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm test
      - run: npm install --no-save --ignore-scripts firebase-tools@14.0.0 @firebase/rules-unit-testing@4.0.1 firebase@11.6.0
      - run: npx firebase emulators:exec --only firestore --project demo-daftar 'node --test tests/rules.emulator.mjs'
