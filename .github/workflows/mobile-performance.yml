name: Mobile performance baseline
on:
  pull_request:
    paths:
      - 'dist/**'
      - 'scripts/browser-mobile-performance.cjs'
      - '.github/workflows/mobile-performance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm install --no-save --ignore-scripts playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: node scripts/browser-mobile-performance.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-performance-baseline
          path: browser-evidence/
          retention-days: 14
